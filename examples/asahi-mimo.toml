profile = "warships"
entity = "Asahi-class destroyer (JMSDF, modern class commissioned from 2018; DD-119 and DD-120)"
schema_file = "warships-fields.toml"

[access]
approved = true
permission_note = "User requested public Asahi research. Collect a bounded sample of official JMSDF and manufacturer pages for analysis, retain attribution and source text, respect robots and all denials. No mirrors or access bypass."
allowed_hosts = ["www.mod.go.jp", "www.mhi.com", "www.geaerospace.com", "en.wikipedia.org", "ja.wikipedia.org"]
user_agent = "DataScrBot/0.1 (https://github.com/minhtuluc/DataScraping)"
min_interval_seconds = 2

[limits]
max_documents = 16
max_model_calls = 36
max_chars = 150000
chunk_chars = 16000
chunk_overlap = 500
field_batch_size = 12
max_output_tokens = 8192
max_source_bytes = 12000000

[discovery]
max_pages = 3
max_candidates = 30
terms = ["asahi", "あさひ", "ash.pdf", "shiranui", "しらぬい"]

[[models]]
provider = "chat_completions"
base_url = "https://api.commandcode.ai/provider/v1"
model = "xiaomi/mimo-v2.6-flash"
api_key_env = "COMMANDCODE_API_KEY"


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datascr-universal"
version = "0.1.0"
description = "Configurable, evidence-first data collection toolkit"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]

[project.scripts]
datascr = "datascr.cli:main"

[tool.setuptools.packages.find]
include = ["datascr*"]
